data:
  dataset: LargeST-CA
  data_path: data/LargeST/large_st_data.h5
  adjacency_path: data/LargeST/ca_rn_adj.npy
  feature_names: [flow]
  units: [vehicles_per_5_minutes]
  history_steps: 12
  forecast_steps: 12
  train_ratio: 0.6
  val_ratio: 0.2
  graph_threshold: 0.0
  graph_directed: true
  sampling_seconds: 300
  use_calendar_features: true
  missing_value_policy: zero
  primary_feature_index: 0

model:
  hidden_dim: 64
  temporal_layers: 2
  dropout: 0.1
  num_regimes: 3
  hierarchy_ratio: 0.03
  max_clusters: 256
  min_clusters: 32
  operator_substeps: 1
  use_delta_decoder: true
  use_hierarchy: true
  use_operator_splitting: true
  use_probabilistic_head: true
  use_event_jump: true
  use_hard_conservation: false
  use_trend_seasonal_residual: true

physics:
  nonnegative_weight: 0.001

training:
  epochs: 20
  batch_size: 8
  evaluation_batch_size: 2
  node_batch_size: 512
  learning_rate: 0.0003
  patience: 5
  seed: 42
  device: auto
  amp: true
  curriculum_start_steps: 1
  curriculum_full_fraction: 0.5
  nll_weight: 1.0
  mae_weight: 0.2
  semigroup_weight: 0.05
  masked_pretrain_weight: 0.05
  output_dir: artifacts/v3/large_st_ca
  deterministic_algorithms: true

study:
  seeds: [13, 42, 97]
  bootstrap_samples: 2000
